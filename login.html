<!DOCTYPE html>
<html lang="id">
<head>
    <title>Sistem Akses [LOGIN]</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <main class="hero-content-area" style="text-align: center; max-width: 600px;">
        <h1 class="neon-text main-title">PORTOFOLIO</h1>
        <p class="subtitle">Masukkan Kredensial Akses untuk Transmisi Data.</p>
        
        <form id="login-form" class="neon-terminal-block contact-form" style="padding: 40px;">
            <label for="username" class="data-line">USERNAME ID</label>
            <input type="text" id="username" required class="neon-input" placeholder="sysadmin">

            <label for="password" class="data-line">PASSWORD ENKRIPSI</label>
            <input type="password" id="password" required class="neon-input" placeholder="**********">

            <button type="submit" class="neon-button-outline submit-button">MASUK SISTEM</button>
            <p id="error-message" style="color: red; margin-top: 15px; display: none;">[ERROR]: Kredensial tidak valid.</p>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
